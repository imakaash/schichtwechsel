name: evals

# The golden questions cost API credit (about 35 cents a run), so they run
# weekly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: gh release download data --pattern warehouse.duckdb --dir data
      - run: sw eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: data/evals/*.json
