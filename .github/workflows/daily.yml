name: daily

# Pull today's postings, fetch new texts, collect yesterday's extraction batch
# and submit today's, check data quality, then rebuild and deploy the app.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency: daily

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore warehouse
        run: gh release download data --pattern warehouse.duckdb --dir data

      - run: sw snapshot
      - run: sw extract collect
      - run: sw details --per-competitor 100
      - run: sw extract submit --limit 2000

      - name: Save data
        run: |
          tar czf "raw-$(date +%F).tar.gz" data/raw
          gh release upload data data/warehouse.duckdb raw-*.tar.gz --clobber

      # a failed check stops here: data is saved, but nothing is deployed
      - run: sw check

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        run: |
          tag="$(date +%F)-${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$tag" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:${{ steps.build.outputs.tag }}"
          curl --retry 10 --retry-connrefused --retry-delay 2 -fsS localhost:8000/health
          curl -fsS localhost:8000/data/meta

      - name: Azure login
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          for app in sw-api sw-ui; do
            az containerapp update --name "$app" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE:${{ steps.build.outputs.tag }}" --output none
          done
