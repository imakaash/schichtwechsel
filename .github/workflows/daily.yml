name: daily

# Pull today's postings, fetch new texts, collect yesterday's extraction batch
# and submit today's, save the data, check its quality. The web app on
# Streamlit Community Cloud downloads the saved warehouse by itself.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency: daily

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore warehouse
        run: gh release download data --pattern warehouse.duckdb --dir data

      - run: sw snapshot
      - run: sw extract collect
      - run: sw details --per-competitor 100
      - run: sw extract submit --limit 2000

      - name: Save data
        run: |
          tar czf "raw-$(date +%F).tar.gz" data/raw
          gh release upload data data/warehouse.duckdb raw-*.tar.gz --clobber

      # runs after saving, so a failed check keeps the data but fails the job
      - run: sw check
