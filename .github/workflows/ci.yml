name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # the latest warehouse lets the data-dependent tests run; they skip without it
      - name: Fetch warehouse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data --pattern warehouse.duckdb --dir data
      - run: pytest -q
