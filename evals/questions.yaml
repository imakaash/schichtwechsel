# Golden questions for the analyst agent.
#
# Expected values are computed by expect_sql at eval time, so the suite stays
# valid as the data changes. Every numeric column of the first result row must
# be mentioned in the answer (rounding to the precision written is fine,
# shares may be written as percent). expect_text_any: at least one of the
# strings must appear. expect_decline: the decline reason(s) accepted; without
# it the agent must not decline. Every answer must also be grounded and in the
# requested language.

- id: pressure_top
  lang: de
  question: Welches Bundesland hat aktuell den höchsten Wettbewerbsdruck auf Filialpersonal?
  expect_sql: |
    SELECT pressure_index FROM mart.hiring_pressure
    WHERE role_family = 'store_sales' AND week = (SELECT max(week) FROM mart.hiring_pressure)
    ORDER BY pressure_index DESC LIMIT 1
  expect_text_any: [Rheinland-Pfalz]

- id: pressure_bottom
  lang: en
  question: Which federal state has the lowest hiring pressure on store staff right now?
  expect_sql: |
    SELECT pressure_index FROM mart.hiring_pressure
    WHERE role_family = 'store_sales' AND week = (SELECT max(week) FROM mart.hiring_pressure)
    ORDER BY pressure_index ASC LIMIT 1
  expect_text_any: [Sachsen-Anhalt, Saxony-Anhalt]

- id: lidl_open
  lang: de
  question: Wie viele offene Stellen hat Lidl im aktuellen Snapshot?
  expect_sql: SELECT open_postings FROM mart.employer_scale WHERE competitor = 'lidl'

- id: kaufland_per_store
  lang: en
  question: How many job postings per 100 stores does Kaufland have?
  expect_sql: SELECT postings_per_100_stores FROM mart.employer_scale WHERE competitor = 'kaufland'

- id: dm_apprentices_per_store
