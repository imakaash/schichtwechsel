  expect_sql: SELECT apprenticeships_per_100_stores FROM mart.employer_scale WHERE competitor = 'dm'

- id: dm_pay_stated
  lang: en
  question: In dm's regular (non-apprenticeship) postings, what share states a pay figure?
  expect_sql: |
    SELECT share_pay_stated FROM mart.pay_transparency WHERE competitor = 'dm' AND track = 'regular'

- id: rossmann_hourly
  lang: de
