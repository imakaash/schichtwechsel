- id: top_driver
  lang: de
  question: Welcher Faktor treibt das Abgangsrisiko laut Modell am stärksten?
  expect_text_any: [Betriebszugehörigkeit, Zugehörigkeit, Tenure, tenure, Dauer der Beschäftigung]

- id: model_auc
  lang: en
  question: How good is the attrition model on the test year, as ROC AUC?
  expect_sql: |
    SELECT value FROM mart.model_quality WHERE model = 'attrition_logistic' AND metric = 'roc_auc'

- id: age_check
  lang: de
  question: Um welchen Faktor überschätzt das Abgangsmodell das Risiko bei Beschäftigten ab 55?
  expect_sql: SELECT ratio FROM mart.attrition_age_check WHERE age_band = '55+'

- id: minijob_exit_rate
  lang: en
  question: What was the voluntary exit rate among minijobbers in the latest month of HR data?
  expect_sql: |
    SELECT round(sum(voluntary_exits) / sum(headcount), 4) FROM mart.workforce_monthly
    WHERE contract_type = 'minijob' AND month = (SELECT max(month) FROM mart.workforce_monthly)

