  expect_sql: |
    SELECT median_hourly_pay FROM mart.pay_transparency
    WHERE competitor = 'rossmann' AND track = 'regular'

- id: rossmann_top_benefit
  lang: en
  question: Which benefit appears most often in Rossmann's postings, and in what share of them?
  expect_sql: |
    SELECT share FROM mart.benefits_matrix WHERE competitor = 'rossmann'
    ORDER BY share DESC LIMIT 1
  expect_text_any: [training, Training, Weiterbildung]

- id: dm_minijob_share
