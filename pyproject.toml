[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schichtwechsel"
version = "0.1.0"
description = "Workforce and hiring intelligence for German drugstore retail"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akash Kumar Yadav" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3",
    "duckdb>=1.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "rich>=13",
    "sqlglot>=25",
    "typer>=0.12",
]

[project.optional-dependencies]
# models on the synthetic HR data; not needed to serve the app
ml = ["scikit-learn>=1.5", "shap>=0.46"]
# API and web UI, what the container runs
app = ["fastapi>=0.115", "plotly>=5.24", "streamlit>=1.45", "uvicorn>=0.30"]
dev = ["schichtwechsel[ml,app]", "pytest>=8", "ruff>=0.5", "ipykernel>=6"]

[project.scripts]
sw = "schichtwechsel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schichtwechsel = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
